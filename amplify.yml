version: 1

backend:
  phases:
    build:
      commands:
        - corepack enable
        - corepack prepare pnpm@10.33.2 --activate
        - pnpm install --frozen-lockfile
        - pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    build:
      commands:
        - corepack enable
        - corepack prepare pnpm@10.33.2 --activate
        - pnpm install --frozen-lockfile
        - pnpm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - .next/cache/**/*
      - .pnpm-store/**/*
      - node_modules/**/*